{{- $dind := default (dict) (index (default (dict) (index .Values "agentJobs")) "dind") -}}
{{- $configureNamespacePodSecurity := true -}}
{{- if hasKey $dind "configureNamespacePodSecurity" -}}
{{- $configureNamespacePodSecurity = index $dind "configureNamespacePodSecurity" -}}
{{- end -}}
{{- if and (default false (index $dind "enabled")) $configureNamespacePodSecurity -}}
{{- $targetNamespace := default .Release.Namespace .Values.config.kubernetesJobsNamespace -}}
{{- $hookName := printf "%s-%s-pod-security" (include "formicae.fullname" .) $targetNamespace | trunc 63 | trimSuffix "-" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "formicae.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $hookName }}
  labels:
    {{- include "formicae.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: [{{ $targetNamespace | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $hookName }}
  labels:
    {{- include "formicae.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
subjects:
  - kind: ServiceAccount
    name: {{ $hookName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $hookName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hookName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "formicae.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "formicae.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: namespace-pod-security
    spec:
      serviceAccountName: {{ $hookName }}
      automountServiceAccountToken: true
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: namespace-pod-security
          image: {{ default (include "formicae.image" (dict "root" . "repository" .Values.worker.image.repository)) .Values.config.kubernetesJobsImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["kubectl"]
          args:
            - label
            - namespace
            - {{ $targetNamespace | quote }}
            - --overwrite
            - pod-security.kubernetes.io/enforce=privileged
            - pod-security.kubernetes.io/enforce-version=latest
            - pod-security.kubernetes.io/audit=baseline
            - pod-security.kubernetes.io/audit-version=latest
            - pod-security.kubernetes.io/warn=baseline
            - pod-security.kubernetes.io/warn-version=latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
