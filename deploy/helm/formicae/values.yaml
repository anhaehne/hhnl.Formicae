replicaCount: 1

image:
  registry: docker.io
  repositoryPrefix: limeray
  tag: "0.30.0"
  pullPolicy: IfNotPresent

api:
  image:
    repository: hhnl-formicae-api
  service:
    type: ClusterIP
    port: 80
    targetPort: http
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  image:
    repository: hhnl-formicae-worker

agentJobs:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
  dind:
    enabled: true
    configureNamespacePodSecurity: true
    image: docker:29.7.2-dind
    storageSizeLimit: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 2Gi
  codexAuth:
    enabled: false
    secretName: formicae-codex-auth
    secretKey: auth.json
    mountPath: /root/.codex

config:
  aspnetcoreHttpPorts: "8080"
  useFakeAdapters: "false"
  persistenceMode: "Postgres"
  workItemMode: "GitHub"
  sourceControlMode: "GitHub"
  agentMode: "OpenHands"
  jobRuntime: "Kubernetes"
  openHandsAuthMethod: "ApiKey"
  openHandsProvider: ""
  openHandsDefaultModel: ""
  openHandsEndpointUrl: ""
  workflowDiscoveryEnabled: "true"
  workflowDiscoveryRepositoryUrl: "https://github.com/anhaehne/hhnl.Formicae"
  workflowDiscoveryBaseBranch: "main"
  workflowDiscoveryModel: ""
  managementAuthEnabled: "false"
  managementAuthInviteCodeExpiration: "7.00:00:00"
  managementAuthBypassForLocalDevelopment: "false"
  openHandsLlmApiKeySecretName: "openhands-llm-api-key"
  openHandsShell: "/bin/sh"
  openHandsBootstrapCommand: ""
  openHandsCommand: ""
  openHandsCodexSubscriptionImage: ""
  openHandsCodexSubscriptionBootstrapCommand: ""
  openHandsCodexSubscriptionCommand: ""
  openHandsCodexSubscriptionLoginCommand: ""
  kubernetesJobsNamespace: ""
  kubernetesJobsImage: ""
  kubernetesJobsWorkspaceVolumeClaim: "formicae-workspaces"
  kubernetesJobsTimeoutSeconds: "1800"
  kubernetesJobsPollIntervalSeconds: "5"
  kubernetesJobsDeleteFinishedJobs: "false"
  kubernetesJobsWorkerCallbackUrl: ""
  runtimeJobsImplementationTimeoutSeconds: "3600"
  runtimeJobsImplementationCheckpointGraceSeconds: "600"

secrets:
  create: true
  connectionString: ""
  postgresDb: "formicae"
  postgresUser: "formicae"
  postgresPassword: ""
  githubWebhookSecret: ""
  # Gitea access tokens and webhook secrets are configured per integration
  # in the management UI/API. These placeholders document expected values for
  # external secret managers that seed integrations out-of-band.
  giteaServerUrl: ""
  giteaAccessToken: ""
  giteaWebhookSecret: ""
  workerCallbackSecret: ""

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 2Gi
  resources: {}

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

imagePullSecrets: []

# Opt in after validating rootless BuildKit on the configured build nodes.
managedImages:
  enabled: false
  registry: "" # Canonical node-reachable hostname (no scheme).
  repositoryPrefix: formicae/local
  workerBaseImage: "" # Defaults to the release worker; a digest is recommended.
  builderImage: moby/buildkit:v0.28.0-rootless
  buildNamespace: "" # Defaults to <release namespace>-image-builds.
  nodeSelector: {}
  concurrency: 2
  timeoutSeconds: 1200
  pushSecretName: "" # External mode: existing dockerconfigjson in build namespace.
  pullSecretNames: [] # Existing pull-only dockerconfigjson Secrets in worker AND build namespaces.
  externalTokenHosts: [] # Explicit HTTPS token-service host allowlist for external registries.
  networkPolicy:
    enabled: false
    # Enable with cluster-specific rules for DNS, registry, source control, package mirrors.
    egress: []
  registryDeployment:
    enabled: true
    image: registry:3.0.0
    storage: 20Gi
    storageClassName: ""
    serviceType: ClusterIP
    tlsSecretName: "" # tls.crt/tls.key trusted by nodes and builders.
    tokenSigningSecretName: "" # cert.crt/key.key; signing certificate also trusted by registry.
    credentialsSecretName: "" # pull-password, at least 24 characters; API only.
    tokenRealm: "" # Public HTTPS /api/registry/token, reachable by nodes and builders.
    tokenIssuer: formicae-images
    tokenService: formicae-registry
